# One command to run everything:  docker compose up --build
# Frontend: http://localhost:3000   Backend API: http://localhost:8080   ML service: http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: floodguard
      POSTGRES_USER: floodguard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-floodguard}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodguard"]
      interval: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      ml-service: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/floodguard
      DB_USER: floodguard
      DB_PASSWORD: ${DB_PASSWORD:-floodguard}
      ML_SERVICE_URL: http://ml-service:8000
      FLOODGUARD_JWT_SECRET: ${FLOODGUARD_JWT_SECRET:-change-this-to-a-long-random-secret-before-deploying}
      FLOODGUARD_ADMIN_PASSWORD: ${FLOODGUARD_ADMIN_PASSWORD:-Admin@123}
      FLOODGUARD_CORS: http://localhost:3000
      FLOODGUARD_UPLOADS_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  pgdata:
  uploads:
